name: Nightly Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch data concurrently
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/fetch_github_trending.py &
          python scripts/fetch_competitions.py &
          python scripts/fetch_hackernews_rss.py &
          python scripts/fetch_word_of_day.py &
          python scripts/fetch_bug_bounties.py &
          wait
      - name: Rank Hot Topics
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/rank_hot_topics.py
      - name: Build Dashboard & Audio
        run: |
          python scripts/build_dashboard_data.py
          python scripts/generate_audio.py
      - run: |
          mkdir -p docs/data docs/audio
      - run: |
          git config user.name "aakh-bot"
          git config user.email "aakh-bot@users.noreply.github.com"
          git add data/
          git add -f docs/data/ docs/audio/
          git diff --cached --quiet || git commit -m "chore: nightly refresh $(date -u +'%Y-%m-%d')"
          git push
      - run: echo "::error::Nightly refresh failed"
        if: failure()
